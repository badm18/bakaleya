name: Build Windows and Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build Windows installer
        run: npm run build -- -P never

      - name: Verify Windows release files
        shell: bash
        run: |
          ls dist/electron/Packaged/*.exe
          ls dist/electron/Packaged/*.blockmap
          test -f dist/electron/Packaged/latest.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakaleya-windows
          path: |
            dist/electron/Packaged/*.exe
            dist/electron/Packaged/*.yml
            dist/electron/Packaged/*.blockmap
          retention-days: 30
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build Linux package
        run: npm run build -- -P never

      - name: Verify Linux release files
        run: |
          ls dist/electron/Packaged/*.deb
          test -f dist/electron/Packaged/latest-linux.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakaleya-linux-deb
          path: |
            dist/electron/Packaged/*.deb
            dist/electron/Packaged/*.yml
            dist/electron/Packaged/*.blockmap
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches application version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: bakaleya-windows
          path: release/windows

      - name: Download Linux files
        uses: actions/download-artifact@v4
        with:
          name: bakaleya-linux-deb
          path: release/linux

      - name: Verify release files
        run: |
          shopt -s nullglob
          windows_installers=(release/windows/*.exe)
          windows_blockmaps=(release/windows/*.blockmap)
          linux_packages=(release/linux/*.deb)
          test "${#windows_installers[@]}" -gt 0
          test "${#windows_blockmaps[@]}" -gt 0
          test "${#linux_packages[@]}" -gt 0
          test -f release/windows/latest.yml
          test -f release/linux/latest-linux.yml

      - name: Create or update one draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.yml
            release/linux/*.deb
            release/linux/*.blockmap
            release/linux/latest-linux.yml
          )

          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
